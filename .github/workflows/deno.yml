name: Deno CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1
      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: |-
            ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.json') }}
          restore-keys: |
            ${{ runner.os }}-deno-
      - name: Deno fmt check
        run: deno fmt --check
      - name: Deno lint
        run: deno lint
      - name: Deno test
        run: deno test
